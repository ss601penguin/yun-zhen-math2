  <script>
    // 15 題二位數加減法題目資料庫（來自最新練習單）
    const questionsData = [
      { id: 1, num1: 33, num2: 53, op: '+', ans: 86 },
      { id: 2, num1: 13, num2: 44, op: '+', ans: 57 },
      { id: 3, num1: 32, num2: 43, op: '+', ans: 75 },
      { id: 4, num1: 14, num2: 82, op: '+', ans: 96 },
      { id: 5, num1: 18, num2: 41, op: '+', ans: 59 },
      { id: 6, num1: 85, num2: 11, op: '+', ans: 96 },
      { id: 7, num1: 52, num2: 26, op: '+', ans: 78 },
      { id: 8, num1: 10, num2: 68, op: '+', ans: 78 },
      { id: 9, num1: 39, num2: 19, op: '-', ans: 20 },
      { id: 10, num1: 85, num2: 22, op: '-', ans: 63 },
      { id: 11, num1: 87, num2: 31, op: '-', ans: 56 },
      { id: 12, num1: 82, num2: 22, op: '-', ans: 60 },
      { id: 13, num1: 62, num2: 50, op: '-', ans: 12 },
      { id: 14, num1: 89, num2: 42, op: '-', ans: 47 },
      { id: 15, num1: 86, num2: 34, op: '-', ans: 52 }
    ];

    let currentQIndex = 0;
    let inputSequence = "";
    let rightInput = "";
    let isTTSEnabled = true;
    let completedQuestions = new Set();
    let isEvaluating = false;
    let wrongTimer = null;

    function calculateExpression(expr) {
      if (!expr) return "";
      // 移除末尾可能的運算子號（如 53- 轉為 53）
      const cleaned = expr.replace(/[+-]+$/, '');
      if (!cleaned) return "";

      const tokens = cleaned.match(/(\d+|[+-])/g);
      if (!tokens) return expr;

      let result = 0;
      let currentOp = '+';

      for (let i = 0; i < tokens.length; i++) {
        const token = tokens[i];
        if (token === '+' || token === '-') {
          currentOp = token;
        } else {
          const num = parseInt(token, 10);
          if (!isNaN(num)) {
            if (currentOp === '+') result += num;
            else if (currentOp === '-') result -= num;
          }
        }
      }
      return result.toString();
    }

    function playTone(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'key') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.25);
          });
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(140, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        }
      } catch (e) {}
    }

    function pressKey(char) {
      if (isEvaluating) return;
      playTone('key');

      if (char === 'CLEAR') {
        inputSequence = "";
        speakText("清空輸入");
      } else if (char === 'BACKSPACE') {
        if (inputSequence.length > 0) {
          inputSequence = inputSequence.slice(0, -1);
          speakText("刪除");
        }
      } else if (char === '=') {
        if (!inputSequence) return;
        // 根據學生輸入算式真實計算，非直接給正確答案
        const calculatedRes = calculateExpression(inputSequence);
        if (calculatedRes !== "") {
          inputSequence = calculatedRes;
          updateDisplay();
          speakText(`等於 ${calculatedRes}`);
        }
        return;
      } else {
        inputSequence += char;
        speakChar(char);
      }

      updateDisplay();
    }

    function pressRightNum(num) {
      if (isEvaluating) return;
      playTone('key');
      rightInput += num;
      speakChar(num);
      updateRightDisplay();
    }

    function pressRightAction(action) {
      if (isEvaluating) return;
      playTone('key');
      if (action === 'BACKSPACE') {
        if (rightInput.length > 0) {
          rightInput = rightInput.slice(0, -1);
          speakText("刪除");
        }
      }
      updateRightDisplay();
    }

    function verifyRightAnswer() {
      if (isEvaluating) return;
      const q = questionsData[currentQIndex];

      if (!rightInput) {
        speakText("請輸入答案");
        return;
      }

      const studentVal = parseInt(rightInput, 10);

      if (studentVal === q.ans) {
        isEvaluating = true;
        playTone('correct');
        completedQuestions.add(q.id);

        speakText(`太棒了，答對了`);
        
        document.getElementById('qStatus').textContent = "本題已答對完成";
        updateProgress();
        triggerConfetti(0.4);

        setTimeout(() => {
          isEvaluating = false;
          if (completedQuestions.size === questionsData.length) {
            showCompletionModal();
          } else if (currentQIndex < questionsData.length - 1) {
            nextQuestion();
          } else {
            const nextUnfinished = questionsData.findIndex(item => !completedQuestions.has(item.id));
            if (nextUnfinished !== -1) {
              loadQuestion(nextUnfinished);
            } else {
              showCompletionModal();
            }
          }
        }, 1800);

      } else {
        isEvaluating = true;
        playTone('wrong');
        showWrongModal();
      }
    }

    function showWrongModal() {
      const modal = document.getElementById('wrongModal');
      modal.classList.remove('hidden');
      speakText("做錯了要再試試看喔");

      if (wrongTimer) clearTimeout(wrongTimer);
      wrongTimer = setTimeout(() => {
        closeWrongModal();
      }, 2000);
    }

    function closeWrongModal() {
      if (wrongTimer) {
        clearTimeout(wrongTimer);
        wrongTimer = null;
      }
      const modal = document.getElementById('wrongModal');
      modal.classList.add('hidden');

      rightInput = "";
      updateRightDisplay();
      isEvaluating = false;
    }

    function loadQuestion(index) {
      currentQIndex = index;
      const q = questionsData[index];
      inputSequence = "";
      rightInput = "";

      document.getElementById('qSelect').value = index;
      document.getElementById('qBadge').textContent = `第 ${q.id} 題 / 共 15 題`;
      
      const n1Tens = Math.floor(q.num1 / 10);
      const n1Ones = q.num1 % 10;
      const n2Tens = Math.floor(q.num2 / 10);
      const n2Ones = q.num2 % 10;

      document.getElementById('vN1Tens').textContent = n1Tens;
      document.getElementById('vN1Ones').textContent = n1Ones;
      document.getElementById('vOp').textContent = q.op === '+' ? '＋' : '－';
      document.getElementById('vN2Tens').textContent = n2Tens;
      document.getElementById('vN2Ones').textContent = n2Ones;

      if (completedQuestions.has(q.id)) {
        document.getElementById('qStatus').textContent = "本題已答對完成";
      } else {
        document.getElementById('qStatus').textContent = "";
      }

      updateDisplay();
      updateRightDisplay();
      speakQuestion();
    }

    function updateRightDisplay() {
      const q = questionsData[currentQIndex];
      const qPromptText = document.getElementById('qPromptText');
      const opSign = q.op === '+' ? '＋' : '－';

      if (completedQuestions.has(q.id)) {
        qPromptText.textContent = `${q.num1} ${opSign} ${q.num2} ＝ ${q.ans}`;
        document.getElementById('vAnsTens').textContent = Math.floor(q.ans / 10);
        document.getElementById('vAnsOnes').textContent = q.ans % 10;
      } else {
        if (rightInput !== "") {
          qPromptText.textContent = `${q.num1} ${opSign} ${q.num2} ＝ ${rightInput}`;
          const val = parseInt(rightInput, 10);
          if (!isNaN(val)) {
            document.getElementById('vAnsTens').textContent = Math.floor(val / 10);
            document.getElementById('vAnsOnes').textContent = val % 10;
          } else {
            document.getElementById('vAnsTens').textContent = "?";
            document.getElementById('vAnsOnes').textContent = "?";
          }
        } else {
          qPromptText.textContent = `${q.num1} ${opSign} ${q.num2} ＝ ？`;
          document.getElementById('vAnsTens').textContent = "?";
          document.getElementById('vAnsOnes').textContent = "?";
        }
      }
    }

    function updateDisplay() {
      const displayText = document.getElementById('calcDisplayText');
      displayText.textContent = inputSequence;
    }

    function speakText(text) {
      if (!isTTSEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-TW';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    function speakChar(c) {
      if (c === '-') speakText("減");
      else if (c === '+') speakText("加");
      else speakText(c);
    }

    function speakQuestion() {
      const q = questionsData[currentQIndex];
      const opText = q.op === '+' ? '加' : '減';
      speakText(`第 ${q.id} 題，${q.num1} ${opText} ${q.num2} 等於多少？`);
    }

    function toggleTTS() {
      isTTSEnabled = !isTTSEnabled;
      const btnText = document.getElementById('ttsText');
      const btnIcon = document.getElementById('ttsIcon');
      if (isTTSEnabled) {
        btnText.textContent = "語音：開啟";
        btnIcon.textContent = "🔊";
        speakText("語音朗讀已開啟");
      } else {
        btnText.textContent = "語音：關閉";
        btnIcon.textContent = "🔇";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function toggleHighContrast() {
      document.body.classList.toggle('high-contrast');
    }

    function initDropdown() {
      const select = document.getElementById('qSelect');
      select.innerHTML = '';
      questionsData.forEach((q, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const opSign = q.op === '+' ? '＋' : '－';
        opt.textContent = `第 ${q.id} 題 (${q.num1} ${opSign} ${q.num2})`;
        select.appendChild(opt);
      });
    }

    function jumpToQuestion(idx) {
      loadQuestion(parseInt(idx, 10));
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        loadQuestion(currentQIndex - 1);
      } else {
        speakText("這是第一題喔");
      }
    }

    function nextQuestion() {
      if (currentQIndex < questionsData.length - 1) {
        loadQuestion(currentQIndex + 1);
      } else {
        speakText("這是最後一題了");
      }
    }

    function updateProgress() {
      document.getElementById('progressText').textContent = `${completedQuestions.size} / ${questionsData.length}`;
    }

    function showCompletionModal() {
      playTone('correct');
      triggerConfetti(3.0);
      speakText("恭喜你，全部十五題二位數減法練習都完成了，你太厲害了");
      document.getElementById('completionModal').classList.remove('hidden');
    }

    function restartPractice() {
      completedQuestions.clear();
      updateProgress();
      document.getElementById('completionModal').classList.add('hidden');
      loadQuestion(0);
    }

    function triggerConfetti(durationSec) {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 - 40,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 9 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rSpeed: (Math.random() - 0.5) * 10
        });
      }

      let startTime = Date.now();
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let elapsed = (Date.now() - startTime) / 1000;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rotation += p.rSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (elapsed < durationSec) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(render);
    }

    window.addEventListener('load', () => {
      initDropdown();
      loadQuestion(0);
    });
  </script>
</body>
